      AI_PLATFORM_AGENT_ID: "018f23a7-6b4d-7c91-8a2e-a12ec7ec7000"
      # 0.0.0.0, not loopback (ADR-0017 Decision 5): architecture-review-agent
      # does not share platform's network namespace, so a loopback bind
