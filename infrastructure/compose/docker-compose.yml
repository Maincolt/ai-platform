# Local-only PostgreSQL and Apache Kafka (KRaft) topology for Sprint 6
# real-service validation. See infrastructure/README.md before use.
#
# This file is not a production deployment: single-node, self-signed-free
# SASL_PLAINTEXT, and locally generated credentials in infrastructure/compose/secrets/.

name: ai-platform-local

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: ai_platform
    secrets:
      - postgres_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-init:
    image: postgres:17.5-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ai_platform
    secrets:
      - postgres_admin_password
      - postgres_orchestrator_migrator_password
      - postgres_orchestrator_app_password
      - postgres_agent_migrator_password
      - postgres_agent_app_password
    volumes:
      - ./scripts/init-postgres.sh:/init/init-postgres.sh:ro
      - ../postgresql:/sql/postgresql:ro
      - ../migrations:/sql/migrations:ro
    entrypoint: ["/bin/bash", "/init/init-postgres.sh"]
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_CLUSTER_ID: "${KAFKA_CLUSTER_ID:-9RIm8zoNSzqhz-gYo6F7MQ}"
      # Advertised to clients as the EXTERNAL listener's reconnect address
      # after the initial bootstrap -- must be reachable from wherever
      # clients actually run, not just from this host. Defaults to
      # "localhost" (correct only when the client runs on the same machine
      # as the broker); the current Docker host is reached remotely, so it
      # overrides this to its own LAN IP (see infrastructure/README.md).
      KAFKA_EXTERNAL_ADVERTISED_HOST: "${KAFKA_EXTERNAL_ADVERTISED_HOST:-localhost}"
    secrets:
      - kafka_admin_password
      - kafka_orchestrator_producer_password
      - kafka_orchestrator_consumer_password
      - kafka_agent_producer_password
      - kafka_agent_consumer_password
      - kafka_summarize_agent_producer_password
      - kafka_summarize_agent_consumer_password
      - kafka_review_agent_producer_password
      - kafka_review_agent_consumer_password
      - kafka_ui_review_agent_producer_password
      - kafka_ui_review_agent_consumer_password
    volumes:
      - ./kafka/entrypoint.sh:/opt/kafka-init/entrypoint.sh:ro
      - kafka-data:/var/lib/kafka/data
    entrypoint: ["/bin/bash", "/opt/kafka-init/entrypoint.sh"]
    ports:
      - "19093:19093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/admin-client.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - kafka_admin_password
    volumes:
      - ./scripts/init-kafka.sh:/init/init-kafka.sh:ro
    entrypoint: ["/bin/bash", "/init/init-kafka.sh"]
    restart: "no"

  # Application processes. Not started by a plain `up`; require
  # `docker compose --profile app up -d` after the image is built
  # (`docker build -f infrastructure/Dockerfile -t ai-platform:sprint6 .`
  # from the repository root) and after postgres-init/kafka-init have
  # completed successfully.
  platform:
    image: ai-platform:sprint6
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      AI_PLATFORM_ENVIRONMENT: development
      AI_PLATFORM_ORCHESTRATOR_KAFKA_SECURITY_PROTOCOL: LOCAL_DEVELOPMENT_SASL_PLAINTEXT
      AI_PLATFORM_ORCHESTRATOR_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_ORCHESTRATOR_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_ORCHESTRATOR_DATABASE_DSN_FILE: /run/secrets/dsn_orchestrator
      AI_PLATFORM_ORCHESTRATOR_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Fallback-only value (ADR-0014 Section 6): the Orchestrator's command
      # publisher now resolves the physical task-commands topic per
      # capability at publish time (KafkaEventPublisher._resolve_topic /
      # command_topic_binding_for_capability), so this is used only if a
      # command is ever published without a capability_name hint.
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.text-word-count.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.text-word-count.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "2"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_ORCHESTRATOR_KAFKA_PRODUCER_USERNAME: orchestrator-producer
      AI_PLATFORM_ORCHESTRATOR_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_orchestrator_producer_password
      AI_PLATFORM_ORCHESTRATOR_KAFKA_CONSUMER_USERNAME: orchestrator-consumer
      AI_PLATFORM_ORCHESTRATOR_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_orchestrator_consumer_password
      AI_PLATFORM_API_HOST: 127.0.0.1
      AI_PLATFORM_API_PORT: "8000"
      AI_PLATFORM_LOCAL_POLICY_ENABLED: "true"
      AI_PLATFORM_REGISTRY_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_ORCHESTRATOR_INSTANCE_ID: "01c0b1bd-a7f9-7765-acd3-b40d9e0b9dda"
      AI_PLATFORM_ORCHESTRATOR_OUTCOME_CONSUMER_GROUP_ID: ai-platform-orchestrator-outcomes
      AI_PLATFORM_ORCHESTRATOR_OUTCOME_LOGICAL_SUBSCRIPTION_ID: orchestrator-outcomes
      AI_PLATFORM_DEADLINE_INTERVAL_SECONDS: "5"
      AI_PLATFORM_DEADLINE_BATCH_SIZE: "50"
      AI_PLATFORM_AGENT_READINESS_TIMEOUT_SECONDS: "2"
      AI_PLATFORM_AGENT_READINESS_TTL_SECONDS: "10"
      AI_PLATFORM_AGENT_READINESS_REFRESH_INTERVAL_SECONDS: "5"
      AI_PLATFORM_TASK_RESULT_TIMEOUT_SECONDS: "60"
    secrets:
      - dsn_orchestrator
      - kafka_orchestrator_producer_password
      - kafka_orchestrator_consumer_password
      - readiness_credential
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro
    ports:
      - "8000:8000"
      - "8100:8100"
      - "8080:80"

  test-agent:
    image: ai-platform:sprint6
    profiles: ["app"]
    # Deliberately no restart policy: network_mode: "service:platform" below
    # ties this container to platform's specific network namespace. Docker
    # restarting *this* container would not fix a stale namespace reference
    # (only removing and recreating it does -- see docs/operations/README.md
    # Section 4), so an automatic restart here would just loop without ever
    # resolving DNS again. After any platform restart/reboot, recreate this
    # service explicitly: docker rm -f + `compose --profile app up -d test-agent`.
    command: ["ai-platform-test-agent"]
    network_mode: "service:platform"
    depends_on:
      platform:
        condition: service_started
    environment:
      AI_PLATFORM_ENVIRONMENT: development
      AI_PLATFORM_AGENT_KAFKA_SECURITY_PROTOCOL: LOCAL_DEVELOPMENT_SASL_PLAINTEXT
      AI_PLATFORM_AGENT_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_AGENT_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_AGENT_DATABASE_DSN_FILE: /run/secrets/dsn_agent
      AI_PLATFORM_AGENT_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.text-word-count.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.text-word-count.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "2"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_USERNAME: agent-producer
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_agent_producer_password
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_USERNAME: agent-consumer
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_agent_consumer_password
      AI_PLATFORM_AGENT_ID: "018f23a7-6b4d-7c91-8a2e-123456789abc"
      AI_PLATFORM_AGENT_READINESS_HOST: 127.0.0.1
      AI_PLATFORM_AGENT_READINESS_PORT: "8100"
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_AGENT_MAXIMUM_CONCURRENCY: "4"
      AI_PLATFORM_AGENT_COMPONENT: local-compose-test-agent
      AI_PLATFORM_AGENT_DECLARATION_DIGEST: "sha256:local-compose-declaration"
      AI_PLATFORM_AGENT_DECLARATION_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_PUBLISHER_INSTANCE_ID: "5dfd3e0a-5e5e-72c0-95cc-c4cbb40fcfc9"
      AI_PLATFORM_AGENT_COMMAND_CONSUMER_GROUP_ID: ai-platform-agent-commands
      AI_PLATFORM_AGENT_COMMAND_LOGICAL_SUBSCRIPTION_ID: agent-commands
    secrets:
      - dsn_agent
      - kafka_agent_producer_password
      - kafka_agent_consumer_password
      - readiness_credential
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro

  # Second Test Agent replica, added ad hoc to validate Kafka assignment
  # fencing/rebalance for the ai-platform-agent-commands consumer group
  # (Sprint 6 remaining acceptance gap). Same consumer group and Kafka/DB
  # secrets as test-agent, but reaches kafka/postgres by service name on the
  # default Compose network rather than sharing platform's network
  # namespace, since it does not need the loopback-only readiness path.
  test-agent-2:
    image: ai-platform:sprint6
    profiles: ["app"]
    restart: unless-stopped
    command: ["ai-platform-test-agent"]
    depends_on:
      platform:
        condition: service_started
    environment:
      AI_PLATFORM_ENVIRONMENT: development
      AI_PLATFORM_AGENT_KAFKA_SECURITY_PROTOCOL: LOCAL_DEVELOPMENT_SASL_PLAINTEXT
      AI_PLATFORM_AGENT_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_AGENT_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_AGENT_DATABASE_DSN_FILE: /run/secrets/dsn_agent
      AI_PLATFORM_AGENT_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.text-word-count.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.text-word-count.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "2"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_USERNAME: agent-producer
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_agent_producer_password
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_USERNAME: agent-consumer
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_agent_consumer_password
      AI_PLATFORM_AGENT_ID: "018f23a7-6b4d-7c91-8a2e-123456789abc"
      AI_PLATFORM_AGENT_READINESS_HOST: 127.0.0.1
      AI_PLATFORM_AGENT_READINESS_PORT: "8100"
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_AGENT_MAXIMUM_CONCURRENCY: "4"
      AI_PLATFORM_AGENT_COMPONENT: local-compose-test-agent
      AI_PLATFORM_AGENT_DECLARATION_DIGEST: "sha256:local-compose-declaration"
      AI_PLATFORM_AGENT_DECLARATION_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_PUBLISHER_INSTANCE_ID: "cc3f7cae-d72a-7bfd-8963-8f6b63260cd9"
      AI_PLATFORM_AGENT_COMMAND_CONSUMER_GROUP_ID: ai-platform-agent-commands
      AI_PLATFORM_AGENT_COMMAND_LOGICAL_SUBSCRIPTION_ID: agent-commands
    secrets:
      - dsn_agent
      - kafka_agent_producer_password
      - kafka_agent_consumer_password
      - readiness_credential
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro

  # The second built-in Agent class (ADR-0014): text.summarize, backed by
  # the AI Router. Reuses the same generic ai-platform-test-agent console
  # script as test-agent/test-agent-2 -- build_agent_process() selects the
  # SummarizeAgent executor from this deployment's registry.json binding
  # (capability_name == "text.summarize"), not from the process name. Not
  # network_mode: "service:platform" (that trick is test-agent-specific);
  # reaches kafka/postgres by service name like test-agent-2, with its own
  # loopback-only readiness listener on its own container network namespace.
  summarize-agent:
    image: ai-platform:sprint6
    profiles: ["app"]
    restart: unless-stopped
    command: ["ai-platform-test-agent"]
    depends_on:
      platform:
        condition: service_started
    environment:
      AI_PLATFORM_ENVIRONMENT: development
      AI_PLATFORM_AGENT_KAFKA_SECURITY_PROTOCOL: LOCAL_DEVELOPMENT_SASL_PLAINTEXT
      AI_PLATFORM_AGENT_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_AGENT_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_AGENT_DATABASE_DSN_FILE: /run/secrets/dsn_agent
      AI_PLATFORM_AGENT_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.text-summarize.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.text-summarize.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "2"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_USERNAME: summarize-agent-producer
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_summarize_agent_producer_password
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_USERNAME: summarize-agent-consumer
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_summarize_agent_consumer_password
      AI_PLATFORM_AGENT_ID: "018f23a7-6b4d-7c91-8a2e-abcdef987654"
      # 0.0.0.0, not loopback (ADR-0017 Decision 5): unlike test-agent,
      # summarize-agent does not share platform's network namespace, so a
      # loopback bind would only ever be reachable from inside this
      # container -- never from platform, which needs to query it over
      # the Compose network at summarize-agent:8100 (see registry.json).
      AI_PLATFORM_AGENT_READINESS_HOST: 0.0.0.0
      AI_PLATFORM_AGENT_READINESS_PORT: "8100"
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_AGENT_MAXIMUM_CONCURRENCY: "4"
      AI_PLATFORM_AGENT_COMPONENT: local-compose-summarize-agent
      AI_PLATFORM_AGENT_DECLARATION_DIGEST: "sha256:local-compose-summarize-declaration"
      AI_PLATFORM_AGENT_DECLARATION_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_PUBLISHER_INSTANCE_ID: "1f2e3d4c-5b6a-7c91-8a2e-9f8e7d6c5b4a"
      AI_PLATFORM_AGENT_COMMAND_CONSUMER_GROUP_ID: ai-platform-summarize-agent-commands
      AI_PLATFORM_AGENT_COMMAND_LOGICAL_SUBSCRIPTION_ID: summarize-agent-commands
      # AI Router (ADR-0014). The referenced keys are checked-in, obviously-
      # fake Sprint 9 placeholders (infrastructure/README.md) -- no real
      # Anthropic/OpenAI credentials exist in this environment, so real
      # text.summarize submissions fail at the provider call, not at startup.
      # Models must be on the ADR-0017 Decision 3 approved list
      # (runtime/composition.py's _APPROVED_ANTHROPIC_MODELS/
      # _APPROVED_OPENAI_MODELS) -- summarize-agent fails closed at
      # startup on any other value.
      AI_PLATFORM_AGENT_AI_ROUTER_ANTHROPIC_API_KEY_FILE: /run/secrets/ai_router_anthropic_api_key
      AI_PLATFORM_AGENT_AI_ROUTER_ANTHROPIC_MODEL: claude-haiku-4-5
      AI_PLATFORM_AGENT_AI_ROUTER_OPENAI_API_KEY_FILE: /run/secrets/ai_router_openai_api_key
      AI_PLATFORM_AGENT_AI_ROUTER_OPENAI_MODEL: gpt-5-mini
      AI_PLATFORM_AGENT_AI_ROUTER_MAX_OUTPUT_TOKENS: "512"
      AI_PLATFORM_AGENT_AI_ROUTER_PROVIDER_TIMEOUT_SECONDS: "20"
    secrets:
      - dsn_agent
      - kafka_summarize_agent_producer_password
      - kafka_summarize_agent_consumer_password
      - readiness_credential
      - ai_router_anthropic_api_key
      - ai_router_openai_api_key
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro

  review-agent:
    image: ai-platform:sprint6
    profiles: ["app"]
    restart: unless-stopped
    command: ["ai-platform-test-agent"]
    depends_on:
      platform:
        condition: service_started
    environment:
      AI_PLATFORM_ENVIRONMENT: development
      AI_PLATFORM_AGENT_KAFKA_SECURITY_PROTOCOL: LOCAL_DEVELOPMENT_SASL_PLAINTEXT
      AI_PLATFORM_AGENT_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_AGENT_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_AGENT_DATABASE_DSN_FILE: /run/secrets/dsn_agent
      AI_PLATFORM_AGENT_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.code-review.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.code-review.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "2"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_USERNAME: review-agent-producer
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_review_agent_producer_password
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_USERNAME: review-agent-consumer
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_review_agent_consumer_password
      AI_PLATFORM_AGENT_ID: "018f23a7-6b4d-7c91-8a2e-fedcba123456"
      # 0.0.0.0, not loopback (ADR-0017 Decision 5): review-agent does not
      # share platform's network namespace, so a loopback bind would only
      # ever be reachable from inside this container -- never from
      # platform, which needs to query it over the Compose network at
      # review-agent:8100 (see registry.json).
      AI_PLATFORM_AGENT_READINESS_HOST: 0.0.0.0
      AI_PLATFORM_AGENT_READINESS_PORT: "8100"
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_AGENT_MAXIMUM_CONCURRENCY: "4"
      AI_PLATFORM_AGENT_COMPONENT: local-compose-review-agent
      AI_PLATFORM_AGENT_DECLARATION_DIGEST: "sha256:local-compose-review-declaration"
      AI_PLATFORM_AGENT_DECLARATION_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_PUBLISHER_INSTANCE_ID: "2a3b4c5d-6e7f-7a91-8a2e-1a2b3c4d5e6f"
      AI_PLATFORM_AGENT_COMMAND_CONSUMER_GROUP_ID: ai-platform-review-agent-commands
      AI_PLATFORM_AGENT_COMMAND_LOGICAL_SUBSCRIPTION_ID: review-agent-commands
      # AI Router (ADR-0014). ADR-0018 Decision 5 deliberately left
      # code.review's own model approval undecided at acceptance time; the
      # repository owner has since decided (during this deployment-wiring
      # PR) to reuse ADR-0017 Decision 3's exact approved list and the same
      # checked-in, obviously-fake placeholder credentials summarize-agent
      # already uses -- no real Anthropic/OpenAI credentials exist in this
      # environment, so a real code.review submission would fail at the
      # provider call, not at startup. Models must be on the ADR-0017
      # Decision 3 approved list (runtime/composition.py's
      # _APPROVED_ANTHROPIC_MODELS/_APPROVED_OPENAI_MODELS) -- review-agent
      # fails closed at startup on any other value.
      AI_PLATFORM_AGENT_AI_ROUTER_ANTHROPIC_API_KEY_FILE: /run/secrets/ai_router_anthropic_api_key
      AI_PLATFORM_AGENT_AI_ROUTER_ANTHROPIC_MODEL: claude-haiku-4-5
      AI_PLATFORM_AGENT_AI_ROUTER_OPENAI_API_KEY_FILE: /run/secrets/ai_router_openai_api_key
      AI_PLATFORM_AGENT_AI_ROUTER_OPENAI_MODEL: gpt-5-mini
      AI_PLATFORM_AGENT_AI_ROUTER_MAX_OUTPUT_TOKENS: "512"
      AI_PLATFORM_AGENT_AI_ROUTER_PROVIDER_TIMEOUT_SECONDS: "20"
    secrets:
      - dsn_agent
      - kafka_review_agent_producer_password
      - kafka_review_agent_consumer_password
      - readiness_credential
      - ai_router_anthropic_api_key
      - ai_router_openai_api_key
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro

  # Shares platform's network namespace, the same way test-agent does
  # (see that service's comment below): nginx proxies to platform's
  # Workflow API at 127.0.0.1:8000, which is intentionally loopback-only
  # (docs/operations/README.md Section 8) -- this reaches it without
  # widening that exposure to the whole Compose network. Port 8080 is
  # therefore published on platform itself, not here (network_mode:
  # "service:platform" containers cannot declare their own ports:).
  dashboard:
    build:
      context: ../../frontend/dashboard
      dockerfile: Dockerfile
    profiles: ["app"]
    # No restart policy, same reasoning as test-agent above: this shares
    # platform's network namespace via network_mode, so it needs recreating
    # (not restarting) whenever platform restarts.
    network_mode: "service:platform"
    depends_on:
      platform:
        condition: service_started

  # ADR-0019: ui.review, the platform's third AI-backed capability. Built
  # from its own dedicated Dockerfile, not the shared ai-platform:sprint6
  # image every other service here uses -- this is the only service that
  # needs Chromium, and a dedicated image keeps that cost (several hundred
  # MB, real build time) isolated to just this one service (ADR-0019
  # Decision 5). The allowed review target is hardcoded in
  # runtime/composition.py's _UI_REVIEW_ALLOWED_TARGET, not an environment
  # variable here -- ADR-0019 Decision 4 deliberately leaves no
  # configuration path that could widen it.
  ui-review-agent:
    build:
      context: ../..
      dockerfile: infrastructure/ui-review-agent/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    command: ["ai-platform-test-agent"]
    depends_on:
      platform:
        condition: service_started
