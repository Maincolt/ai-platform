      AI_PLATFORM_AGENT_READINESS_HOST: 0.0.0.0
      AI_PLATFORM_AGENT_READINESS_PORT: "8100"
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_AGENT_MAXIMUM_CONCURRENCY: "4"
      AI_PLATFORM_AGENT_COMPONENT: local-compose-architecture-review-agent
      AI_PLATFORM_AGENT_DECLARATION_DIGEST: "sha256:local-compose-architecture-review-declaration"
      AI_PLATFORM_AGENT_DECLARATION_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_PUBLISHER_INSTANCE_ID: "5d6e7f80-91a2-7db3-8c4f-4d5e6f708192"
      AI_PLATFORM_AGENT_COMMAND_CONSUMER_GROUP_ID: ai-platform-architecture-review-agent-commands
      AI_PLATFORM_AGENT_COMMAND_LOGICAL_SUBSCRIPTION_ID: architecture-review-agent-commands
      # AI Router (ADR-0014). ADR-0020 Decision 3 reuses ADR-0017 Decision
      # 3's exact approved model list unchanged. Real Anthropic (primary)
