      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
