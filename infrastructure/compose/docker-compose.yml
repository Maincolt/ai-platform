      AI_PLATFORM_AGENT_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_AGENT_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_AGENT_DATABASE_DSN_FILE: /run/secrets/dsn_agent
      AI_PLATFORM_AGENT_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.ui-review.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.ui-review.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "2"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_USERNAME: ui-review-agent-producer
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_ui_review_agent_producer_password
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_USERNAME: ui-review-agent-consumer
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_ui_review_agent_consumer_password
      AI_PLATFORM_AGENT_ID: "018f23a7-6b4d-7c91-8a2e-c0ffee123456"
      # 0.0.0.0, not loopback (ADR-0017 Decision 5): ui-review-agent does
      # not share platform's network namespace, so a loopback bind would
      # only ever be reachable from inside this container -- never from
      # platform, which needs to query it over the Compose network at
      # ui-review-agent:8100 (see registry.json).
      AI_PLATFORM_AGENT_READINESS_HOST: 0.0.0.0
      AI_PLATFORM_AGENT_READINESS_PORT: "8100"
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_AGENT_MAXIMUM_CONCURRENCY: "4"
      AI_PLATFORM_AGENT_COMPONENT: local-compose-ui-review-agent
      AI_PLATFORM_AGENT_DECLARATION_DIGEST: "sha256:local-compose-ui-review-declaration"
      AI_PLATFORM_AGENT_DECLARATION_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_PUBLISHER_INSTANCE_ID: "4c5d6e7f-8091-7ca2-9b3e-3c4d5e6f7081"
      AI_PLATFORM_AGENT_COMMAND_CONSUMER_GROUP_ID: ai-platform-ui-review-agent-commands
      AI_PLATFORM_AGENT_COMMAND_LOGICAL_SUBSCRIPTION_ID: ui-review-agent-commands
      # AI Router (ADR-0014). ADR-0019 Decision 3 reuses ADR-0017 Decision
      # 3's exact approved model list and the same checked-in, obviously-
      # fake placeholder credentials summarize-agent/review-agent already
      # use -- no real Anthropic/OpenAI credentials exist in this
      # environment, so a real ui.review submission would fail at the
      # provider call, not at startup. Models must be on the ADR-0017
      # Decision 3 approved list (runtime/composition.py's
      # _APPROVED_ANTHROPIC_MODELS/_APPROVED_OPENAI_MODELS) -- ui-review-agent
      # fails closed at startup on any other value.
      AI_PLATFORM_AGENT_AI_ROUTER_ANTHROPIC_API_KEY_FILE: /run/secrets/ai_router_anthropic_api_key
      AI_PLATFORM_AGENT_AI_ROUTER_ANTHROPIC_MODEL: claude-haiku-4-5
      AI_PLATFORM_AGENT_AI_ROUTER_OPENAI_API_KEY_FILE: /run/secrets/ai_router_openai_api_key
      AI_PLATFORM_AGENT_AI_ROUTER_OPENAI_MODEL: gpt-5-mini
      AI_PLATFORM_AGENT_AI_ROUTER_MAX_OUTPUT_TOKENS: "512"
      AI_PLATFORM_AGENT_AI_ROUTER_PROVIDER_TIMEOUT_SECONDS: "20"
    secrets:
      - dsn_agent
      - kafka_ui_review_agent_producer_password
      - kafka_ui_review_agent_consumer_password
      - readiness_credential
      - ai_router_anthropic_api_key
      - ai_router_openai_api_key
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro

  # ADR-0020: architecture.review, the platform's fifth capability. Built
