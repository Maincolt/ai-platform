# Local-only PostgreSQL and Apache Kafka (KRaft) topology for Sprint 6
# real-service validation. See infrastructure/README.md before use.
#
# This file is not a production deployment: single-node, self-signed-free
# SASL_PLAINTEXT, and locally generated credentials in infrastructure/compose/secrets/.

name: ai-platform-local

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: ai_platform
    secrets:
      - postgres_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-init:
    image: postgres:17.5-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ai_platform
    secrets:
      - postgres_admin_password
      - postgres_orchestrator_migrator_password
      - postgres_orchestrator_app_password
      - postgres_agent_migrator_password
      - postgres_agent_app_password
    volumes:
      - ./scripts/init-postgres.sh:/init/init-postgres.sh:ro
      - ../postgresql:/sql/postgresql:ro
      - ../migrations:/sql/migrations:ro
    entrypoint: ["/bin/bash", "/init/init-postgres.sh"]
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_CLUSTER_ID: "${KAFKA_CLUSTER_ID:-9RIm8zoNSzqhz-gYo6F7MQ}"
    secrets:
      - kafka_admin_password
      - kafka_orchestrator_producer_password
      - kafka_orchestrator_consumer_password
      - kafka_agent_producer_password
      - kafka_agent_consumer_password
    volumes:
      - ./kafka/entrypoint.sh:/opt/kafka-init/entrypoint.sh:ro
      - kafka-data:/var/lib/kafka/data
    entrypoint: ["/bin/bash", "/opt/kafka-init/entrypoint.sh"]
    ports:
      - "19093:19093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/admin-client.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - kafka_admin_password
    volumes:
      - ./scripts/init-kafka.sh:/init/init-kafka.sh:ro
    entrypoint: ["/bin/bash", "/init/init-kafka.sh"]
    restart: "no"

  # Application processes. Not started by a plain `up`; require
  # `podman compose --profile app up -d` after the image is built
  # (`podman build -f infrastructure/Dockerfile -t ai-platform:sprint6 .`
  # from the repository root) and after postgres-init/kafka-init have
  # completed successfully.
  platform:
    image: ai-platform:sprint6
    profiles: ["app"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      AI_PLATFORM_ENVIRONMENT: development
      AI_PLATFORM_ORCHESTRATOR_KAFKA_SECURITY_PROTOCOL: LOCAL_DEVELOPMENT_SASL_PLAINTEXT
      AI_PLATFORM_ORCHESTRATOR_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_ORCHESTRATOR_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_ORCHESTRATOR_DATABASE_DSN_FILE: /run/secrets/dsn_orchestrator
      AI_PLATFORM_ORCHESTRATOR_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "0.5"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_ORCHESTRATOR_KAFKA_PRODUCER_USERNAME: orchestrator-producer
      AI_PLATFORM_ORCHESTRATOR_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_orchestrator_producer_password
      AI_PLATFORM_ORCHESTRATOR_KAFKA_CONSUMER_USERNAME: orchestrator-consumer
      AI_PLATFORM_ORCHESTRATOR_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_orchestrator_consumer_password
      AI_PLATFORM_API_HOST: 127.0.0.1
      AI_PLATFORM_API_PORT: "8000"
      AI_PLATFORM_LOCAL_POLICY_ENABLED: "true"
      AI_PLATFORM_REGISTRY_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_READINESS_URL: http://127.0.0.1:8100/health/ready
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_ORCHESTRATOR_INSTANCE_ID: "01c0b1bd-a7f9-7765-acd3-b40d9e0b9dda"
      AI_PLATFORM_ORCHESTRATOR_OUTCOME_CONSUMER_GROUP_ID: ai-platform-orchestrator-outcomes
      AI_PLATFORM_ORCHESTRATOR_OUTCOME_LOGICAL_SUBSCRIPTION_ID: orchestrator-outcomes
      AI_PLATFORM_DEADLINE_INTERVAL_SECONDS: "5"
      AI_PLATFORM_DEADLINE_BATCH_SIZE: "50"
      AI_PLATFORM_AGENT_READINESS_TIMEOUT_SECONDS: "2"
      AI_PLATFORM_AGENT_READINESS_TTL_SECONDS: "10"
      AI_PLATFORM_AGENT_READINESS_REFRESH_INTERVAL_SECONDS: "5"
      AI_PLATFORM_TASK_RESULT_TIMEOUT_SECONDS: "60"
    secrets:
      - dsn_orchestrator
      - kafka_orchestrator_producer_password
      - kafka_orchestrator_consumer_password
      - readiness_credential
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro
    ports:
      - "8000:8000"
      - "8100:8100"

  test-agent:
    image: ai-platform:sprint6
    profiles: ["app"]
    command: ["ai-platform-test-agent"]
    network_mode: "service:platform"
    depends_on:
      platform:
        condition: service_started
    environment:
      AI_PLATFORM_ENVIRONMENT: development
      AI_PLATFORM_AGENT_KAFKA_SECURITY_PROTOCOL: LOCAL_DEVELOPMENT_SASL_PLAINTEXT
      AI_PLATFORM_AGENT_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_AGENT_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_AGENT_DATABASE_DSN_FILE: /run/secrets/dsn_agent
      AI_PLATFORM_AGENT_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "0.5"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_USERNAME: agent-producer
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_agent_producer_password
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_USERNAME: agent-consumer
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_agent_consumer_password
      AI_PLATFORM_AGENT_ID: "018f23a7-6b4d-7c91-8a2e-123456789abc"
      AI_PLATFORM_AGENT_READINESS_HOST: 127.0.0.1
      AI_PLATFORM_AGENT_READINESS_PORT: "8100"
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_AGENT_MAXIMUM_CONCURRENCY: "4"
      AI_PLATFORM_AGENT_COMPONENT: local-compose-test-agent
      AI_PLATFORM_AGENT_DECLARATION_DIGEST: "sha256:local-compose-declaration"
      AI_PLATFORM_AGENT_DECLARATION_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_PUBLISHER_INSTANCE_ID: "5dfd3e0a-5e5e-72c0-95cc-c4cbb40fcfc9"
      AI_PLATFORM_AGENT_COMMAND_CONSUMER_GROUP_ID: ai-platform-agent-commands
      AI_PLATFORM_AGENT_COMMAND_LOGICAL_SUBSCRIPTION_ID: agent-commands
    secrets:
      - dsn_agent
      - kafka_agent_producer_password
      - kafka_agent_consumer_password
      - readiness_credential
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro

  # Second Test Agent replica, added ad hoc to validate Kafka assignment
  # fencing/rebalance for the ai-platform-agent-commands consumer group
  # (Sprint 6 remaining acceptance gap). Same consumer group and Kafka/DB
  # secrets as test-agent, but reaches kafka/postgres by service name on the
  # default Compose network rather than sharing platform's network
  # namespace, since it does not need the loopback-only readiness path.
  test-agent-2:
    image: ai-platform:sprint6
    profiles: ["app"]
    command: ["ai-platform-test-agent"]
    depends_on:
      platform:
        condition: service_started
    environment:
      AI_PLATFORM_ENVIRONMENT: development
      AI_PLATFORM_AGENT_KAFKA_SECURITY_PROTOCOL: LOCAL_DEVELOPMENT_SASL_PLAINTEXT
      AI_PLATFORM_AGENT_DATABASE_POOL_MIN_SIZE: "1"
      AI_PLATFORM_AGENT_DATABASE_POOL_MAX_SIZE: "5"
      AI_PLATFORM_AGENT_DATABASE_DSN_FILE: /run/secrets/dsn_agent
      AI_PLATFORM_AGENT_DATABASE_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_PLATFORM_TASK_COMMANDS_TOPIC: ai-platform.development.task-commands.v1
      AI_PLATFORM_TASK_COMMANDS_QUARANTINE_TOPIC: ai-platform.development.task-commands.v1.quarantine
      AI_PLATFORM_TASK_OUTCOMES_TOPIC: ai-platform.development.task-outcomes.v1
      AI_PLATFORM_TASK_OUTCOMES_QUARANTINE_TOPIC: ai-platform.development.task-outcomes.v1.quarantine
      AI_PLATFORM_CONTRACT_SCHEMA_DIRECTORY: /app/contracts/json-schema/v1
      AI_PLATFORM_PUBLISH_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_CONSUMER_POLL_TIMEOUT_SECONDS: "1"
      AI_PLATFORM_CONSUMER_RETRY_DELAY_SECONDS: "0.5"
      AI_PLATFORM_CONSUMER_MAXIMUM_PROCESSING_ATTEMPTS: "5"
      AI_PLATFORM_WORKER_IDLE_DELAY_SECONDS: "0.5"
      AI_PLATFORM_OUTBOX_CLAIM_TTL_SECONDS: "30"
      AI_PLATFORM_OUTBOX_MAXIMUM_PUBLICATION_ATTEMPTS: "5"
      AI_PLATFORM_QUARANTINE_RECONCILIATION_LIMIT: "50"
      AI_PLATFORM_QUARANTINE_QUERY_TIMEOUT_SECONDS: "5"
      AI_PLATFORM_STARTUP_TIMEOUT_SECONDS: "30"
      AI_PLATFORM_SHUTDOWN_GRACE_SECONDS: "10"
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_USERNAME: agent-producer
      AI_PLATFORM_AGENT_KAFKA_PRODUCER_PASSWORD_FILE: /run/secrets/kafka_agent_producer_password
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_USERNAME: agent-consumer
      AI_PLATFORM_AGENT_KAFKA_CONSUMER_PASSWORD_FILE: /run/secrets/kafka_agent_consumer_password
      AI_PLATFORM_AGENT_ID: "018f23a7-6b4d-7c91-8a2e-123456789abc"
      AI_PLATFORM_AGENT_READINESS_HOST: 127.0.0.1
      AI_PLATFORM_AGENT_READINESS_PORT: "8100"
      AI_PLATFORM_READINESS_CREDENTIAL_FILE: /run/secrets/readiness_credential
      AI_PLATFORM_AGENT_MAXIMUM_CONCURRENCY: "4"
      AI_PLATFORM_AGENT_COMPONENT: local-compose-test-agent
      AI_PLATFORM_AGENT_DECLARATION_DIGEST: "sha256:local-compose-declaration"
      AI_PLATFORM_AGENT_DECLARATION_PATH: /app/runtime-config/registry.json
      AI_PLATFORM_AGENT_PUBLISHER_INSTANCE_ID: "cc3f7cae-d72a-7bfd-8963-8f6b63260cd9"
      AI_PLATFORM_AGENT_COMMAND_CONSUMER_GROUP_ID: ai-platform-agent-commands
      AI_PLATFORM_AGENT_COMMAND_LOGICAL_SUBSCRIPTION_ID: agent-commands
    secrets:
      - dsn_agent
      - kafka_agent_producer_password
      - kafka_agent_consumer_password
      - readiness_credential
    volumes:
      - ./runtime/registry.json:/app/runtime-config/registry.json:ro

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt
  postgres_orchestrator_migrator_password:
    file: ./secrets/postgres_orchestrator_migrator_password.txt
  postgres_orchestrator_app_password:
    file: ./secrets/postgres_orchestrator_app_password.txt
  postgres_agent_migrator_password:
    file: ./secrets/postgres_agent_migrator_password.txt
  postgres_agent_app_password:
    file: ./secrets/postgres_agent_app_password.txt
  kafka_admin_password:
    file: ./secrets/kafka_admin_password.txt
  kafka_orchestrator_producer_password:
    file: ./secrets/kafka_orchestrator_producer_password.txt
  kafka_orchestrator_consumer_password:
    file: ./secrets/kafka_orchestrator_consumer_password.txt
  kafka_agent_producer_password:
    file: ./secrets/kafka_agent_producer_password.txt
  kafka_agent_consumer_password:
    file: ./secrets/kafka_agent_consumer_password.txt
  dsn_orchestrator:
    file: ./secrets/dsn_orchestrator.txt
  dsn_agent:
    file: ./secrets/dsn_agent.txt
  readiness_credential:
    file: ./secrets/readiness_credential.txt

volumes:
  postgres-data:
  kafka-data:
