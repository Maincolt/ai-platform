[project]
name = "ai-platform"
version = "0.1.0"
description = "AI Platform: a foundation for coordinating specialized AI agents through modular boundaries and event-driven communication."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "rfc8785>=0.1.4",
    "jsonschema>=4.23",
    "psycopg[binary,pool]>=3.2",
    "confluent-kafka>=2.5",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.60",
]

[project.scripts]
ai-platform = "ai_platform.runtime.platform_main:main"
ai-platform-test-agent = "ai_platform.runtime.agent_main:main"

[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
    "pytest",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_platform"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[[tool.basedpyright.executionEnvironments]]
# FastAPI's TestClient (httpx-based) exposes several overloads whose
# sentinel default values (httpx._client.USE_CLIENT_DEFAULT) make
# basedpyright report them as partially "Unknown" -- a confirmed upstream
# typing gap in httpx/Starlette itself, not our code. Scoped narrowly to
# API component tests that use TestClient; the rest of the tree remains
# fully strict.
root = "tests/component/api"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not external_service\""
markers = [
    "external_service: requires real PostgreSQL/Kafka via infrastructure/compose/ (opt-in: uv run pytest -m external_service)",
]
